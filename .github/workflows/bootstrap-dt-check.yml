name: Bootstrap DT scheduler

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-dt-check.yml

permissions: {}

jobs:
  dispatch:
    if: ${{ github.repository == 'grigsargsian/wb-dt-scheduler' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write

    steps:
      - name: Dispatch one DT check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data '{"ref":"main"}' \
            --output /dev/null \
            "${GITHUB_API_URL}/repos/grigsargsian/wb-dt-scheduler/actions/workflows/wb-dt-check.yml/dispatches"

# diagnostic retry 3
